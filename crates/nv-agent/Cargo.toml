[package]
name = "nv-agent"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "NeedleVoice"
path = "src/main.rs"

[dependencies]
nv-core = { path = "../nv-core" }
cpal = "0.18"
whisper-rs = "0.16"
webrtc-vad = "0.4"
sherpa-onnx = { version = "1.13.8", default-features = false, features = ["shared"] }
tiny-skia = "0.12"
log = "0.4"

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Devices_FunctionDiscovery",
]

[build-dependencies]
winresource = "0.1"

[features]
# Speech recognition on the graphics card: several times faster than the CPU,
# which is what makes the accurate models usable. `cuda` needs the CUDA toolkit
# installed, `vulkan` needs the Vulkan SDK; both also need a driver that
# supports them.
gpu = []
cuda = ["whisper-rs/cuda", "gpu"]
vulkan = ["whisper-rs/vulkan", "gpu"]
